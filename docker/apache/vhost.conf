<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        # Necesario para que el .htaccess de CodeIgniter pueda usar mod_rewrite.
        AllowOverride All
        Require all granted
    </Directory>

    # Los logs van a la salida del contenedor: docker compose logs -f web
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
