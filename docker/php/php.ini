; Configuracion de DESARROLLO. No usar tal cual en produccion:
; display_errors expone rutas y trazas al navegador.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr

date.timezone = America/Mexico_City

memory_limit = 256M
max_execution_time = 120

upload_max_filesize = 64M
post_max_size = 64M
