services:
  # Apache 2.4.25 + PHP 5.6.40 (mod_php). La imagen base solo existe para
  # linux/amd64, asi que en Apple Silicon corre bajo emulacion.
  web:
    build:
      context: ./docker
      dockerfile: php/Dockerfile
    platform: linux/amd64
    container_name: tai_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT}:80"
    volumes:
      - ./www:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tai

  db:
    image: postgres:9.5
    platform: linux/amd64
    container_name: tai_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres solo ejecuta estos scripts si el volumen esta vacio.
      # Para re-ejecutarlos: docker compose down -v && docker compose up -d
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tai

  # Pinneado a la rama 7.x: las versiones 8.x/9.x han ido retirando el soporte
  # de servidores PostgreSQL antiguos como el 9.5.
  pgadmin:
    image: dpage/pgadmin4:7.8
    container_name: tai_pgadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PGADMIN_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Deja el servidor "PostgreSQL 9.5 (Docker)" ya registrado al arrancar.
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      # Consultas del Dashboard adaptadas a 9.5: las que trae pgAdmin asumen
      # 9.6+ y fallan con 'column "wait_event_type" does not exist'.
      - ./docker/pgadmin/sql:/pgadmin4/pgadmin/dashboard/templates/dashboard/sql/default:ro
      # Mismo problema en el arbol de objetos: la plantilla mas antigua que trae
      # pgAdmin 7.8 para las tablas ya asume PostgreSQL 10 y filtra por
      # rel.relispartition, columna que no existe en 9.5. Sin esto, el nodo
      # Tables no se expande y la tabla usuarios no aparece por ningun lado.
      # Quitar esa condicion es seguro: en 9.5 no hay particionamiento
      # declarativo, asi que nunca descartaba ninguna fila.
      - ./docker/pgadmin/tables/nodes.sql:/pgadmin4/pgadmin/browser/server_groups/servers/databases/schemas/tables/templates/tables/sql/default/nodes.sql:ro
      - ./docker/pgadmin/tables/count.sql:/pgadmin4/pgadmin/browser/server_groups/servers/databases/schemas/tables/templates/tables/sql/default/count.sql:ro
      - ./docker/pgadmin/tables/properties.sql:/pgadmin4/pgadmin/browser/server_groups/servers/databases/schemas/tables/templates/tables/sql/default/properties.sql:ro
      - ./docker/pgadmin/tables/get_inherits.sql:/pgadmin4/pgadmin/browser/server_groups/servers/databases/schemas/tables/templates/tables/sql/default/get_inherits.sql:ro
      # Al conectar, pgAdmin llama a pg_is_wal_replay_paused(), que en 9.5 aun
      # se llamaba pg_is_xlog_replay_paused() (el renombrado xlog -> wal es de
      # la 10). No rompe nada, pero llena el log de errores en cada conexion.
      - ./docker/pgadmin/connect/check_recovery.sql:/pgadmin4/pgadmin/browser/server_groups/servers/templates/connect/sql/default/check_recovery.sql:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tai

volumes:
  pgdata:
  pgadmin_data:

networks:
  tai:
    driver: bridge
